# harnessweaver policy test harness.yaml --cases policy_tests.yaml
# The governor's verdict on single tool calls, decided exactly as in production,
# with nothing executed.
cases:
  - id: approval-asks-a-maintainer
    tool: approve_pr
    args: { number: 101 }
    principal: { id: dana, roles: [member] }
    expect: require_approval
    approver_role: maintainer
  - id: outsiders-never-get-an-approval
    tool: approve_pr
    args: { number: 101 }
    principal: { id: mallory, roles: [external] }
    expect: block
    code: policy_denied
  - id: a-comment-after-reading-the-diff
    tool: post_comment
    args: { number: 102, body: "Pass email as a query parameter." }
    labels: { untrusted_seen: true }
    expect: allow
  - id: a-comment-after-reading-the-diff-and-the-private-repo
    tool: post_comment
    args: { number: 106, body: "DB_HOST=db.internal" }
    labels: { untrusted_seen: true, private_seen: true }
    expect: block
    code: trifecta
  - id: path-traversal
    tool: read_file
    args: { path: "../../etc/passwd" }
    expect: block
    step: 2
  - id: empty-comment
    tool: post_comment
    args: { number: 102, body: "" }
    expect: block
    step: 2
